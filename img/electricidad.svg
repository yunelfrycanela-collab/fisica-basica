<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Circuito eléctrico en serie con pila, resistencia y sentido de la corriente">
  <defs>
    <linearGradient id="bgEle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="1" stop-color="#d3e3ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgEle)"/>

  <!-- Cable del circuito -->
  <rect x="120" y="100" width="400" height="190" rx="10" fill="none" stroke="#334155" stroke-width="5"/>

  <!-- Pila (batería) en el segmento izquierdo -->
  <rect x="96" y="168" width="48" height="60" fill="#eaf2ff"/>
  <line x1="100" y1="182" x2="140" y2="182" stroke="#334155" stroke-width="6"/>
  <line x1="110" y1="212" x2="130" y2="212" stroke="#334155" stroke-width="12"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#dc2626">
    <text x="70" y="190">+</text>
    <text x="70" y="222">–</text>
  </g>

  <!-- Resistencia en el segmento superior -->
  <rect x="250" y="80" width="150" height="42" fill="#eaf2ff"/>
  <path d="M255 100 l 16 -20 l 20 40 l 20 -40 l 20 40 l 20 -40 l 20 40 l 16 -20"
        fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round"/>
  <text x="325" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">R</text>

  <!-- Sentido de la corriente -->
  <g stroke="#059669" stroke-width="5" fill="#059669">
    <line x1="440" y1="290" x2="330" y2="290" stroke-linecap="round"/>
    <polygon points="330,290 358,278 358,302"/>
  </g>
  <text x="360" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#059669">I</text>
</svg>
