<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Onda senoidal con su amplitud y longitud de onda señaladas">
  <defs>
    <linearGradient id="bgOnd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="1" stop-color="#d3e3ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgOnd)"/>

  <!-- Eje -->
  <line x1="30" y1="180" x2="610" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Onda -->
  <path d="M40 180 q 40 -100 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0"
        fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>

  <!-- Amplitud -->
  <g stroke="#dc2626" stroke-width="3">
    <line x1="40" y1="88" x2="120" y2="88" stroke-dasharray="5 5"/>
    <line x1="40" y1="88" x2="40" y2="180"/>
    <line x1="30" y1="88" x2="50" y2="88"/>
  </g>
  <text x="52" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#dc2626">A</text>

  <!-- Longitud de onda -->
  <g stroke="#059669" stroke-width="4" fill="#059669">
    <line x1="40" y1="300" x2="200" y2="300" stroke-linecap="round"/>
    <polygon points="40,300 66,289 66,311"/>
    <polygon points="200,300 174,289 174,311"/>
  </g>
  <line x1="40" y1="200" x2="40" y2="305" stroke="#059669" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="200" y1="200" x2="200" y2="305" stroke="#059669" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="98" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#059669">λ</text>
</svg>
