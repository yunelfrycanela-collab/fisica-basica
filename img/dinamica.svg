<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Diagrama de fuerzas sobre un bloque: fuerza aplicada, rozamiento, peso y normal">
  <defs>
    <linearGradient id="bgDin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="1" stop-color="#d3e3ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgDin)"/>

  <!-- Suelo -->
  <rect x="0" y="270" width="640" height="12" fill="#94a3b8"/>
  <g stroke="#64748b" stroke-width="2">
    <line x1="60" y1="282" x2="30" y2="310"/>
    <line x1="140" y1="282" x2="110" y2="310"/>
    <line x1="220" y1="282" x2="190" y2="310"/>
    <line x1="300" y1="282" x2="270" y2="310"/>
    <line x1="380" y1="282" x2="350" y2="310"/>
    <line x1="460" y1="282" x2="430" y2="310"/>
    <line x1="540" y1="282" x2="510" y2="310"/>
    <line x1="620" y1="282" x2="590" y2="310"/>
  </g>

  <!-- Bloque -->
  <rect x="250" y="180" width="140" height="90" rx="10" fill="#2563eb"/>
  <text x="320" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">m</text>

  <!-- Fuerza aplicada F -->
  <g stroke="#dc2626" stroke-width="6" fill="#dc2626">
    <line x1="400" y1="205" x2="550" y2="205" stroke-linecap="round"/>
    <polygon points="550,205 522,191 522,219"/>
  </g>
  <text x="470" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#dc2626" text-anchor="middle">F</text>

  <!-- Rozamiento f -->
  <g stroke="#ea580c" stroke-width="5" fill="#ea580c">
    <line x1="240" y1="245" x2="120" y2="245" stroke-linecap="round"/>
    <polygon points="120,245 148,231 148,259"/>
  </g>
  <text x="185" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ea580c" text-anchor="middle">f</text>

  <!-- Normal N -->
  <g stroke="#059669" stroke-width="5" fill="#059669">
    <line x1="290" y1="170" x2="290" y2="70" stroke-linecap="round"/>
    <polygon points="290,70 278,98 302,98"/>
  </g>
  <text x="262" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#059669">N</text>

  <!-- Peso W -->
  <g stroke="#7c3aed" stroke-width="5" fill="#7c3aed">
    <line x1="360" y1="200" x2="360" y2="340" stroke-linecap="round"/>
    <polygon points="360,340 348,312 372,312"/>
  </g>
  <text x="382" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#7c3aed">W</text>
</svg>
