<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Termómetro con mercurio y ondas de calor">
  <defs>
    <linearGradient id="bgTer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="1" stop-color="#d3e3ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgTer)"/>

  <!-- Ondas de calor -->
  <g fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M470 150 q 22 -28 0 -56 q -22 -28 0 -56"/>
    <path d="M520 156 q 22 -28 0 -56 q -22 -28 0 -56"/>
    <path d="M570 150 q 22 -28 0 -56 q -22 -28 0 -56"/>
  </g>

  <!-- Tubo -->
  <rect x="286" y="60" width="40" height="250" rx="20" fill="#ffffff" stroke="#1e40af" stroke-width="4"/>
  <!-- Mercurio en el tubo -->
  <rect x="297" y="170" width="18" height="130" rx="9" fill="#ef4444"/>
  <!-- Bulbo -->
  <circle cx="306" cy="300" r="44" fill="#ef4444" stroke="#1e40af" stroke-width="4"/>

  <!-- Escala -->
  <g stroke="#1e40af" stroke-width="3">
    <line x1="326" y1="110" x2="352" y2="110"/>
    <line x1="326" y1="160" x2="352" y2="160"/>
    <line x1="326" y1="210" x2="352" y2="210"/>
    <line x1="326" y1="260" x2="352" y2="260"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#1e40af" font-weight="600">
    <text x="360" y="117">100°</text>
    <text x="360" y="167">75°</text>
    <text x="360" y="217">50°</text>
    <text x="360" y="267">25°</text>
  </g>

  <text x="120" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e40af">Temperatura</text>
  <text x="120" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#5a6780">y calor</text>
</svg>
